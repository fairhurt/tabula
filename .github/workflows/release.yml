# Builds the Windows installer, and publishes a GitHub release when a version
# tag is pushed:
#
#   1. Set `version` in Cargo.toml (say 0.3.0) and commit.
#   2. git tag v0.3.0 && git push origin v0.3.0
#
# Tabula's own update check reads the latest release, so publishing here is
# what makes installed copies offer the update.
#
# To try the build without releasing anything, run this workflow by hand
# (Actions > Release > Run workflow). It builds the same files and attaches
# them to the run as an artifact instead of publishing them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Read the version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          # A release's tag must be the version in Cargo.toml.
          if ($env:GITHUB_REF_TYPE -eq "tag" -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "The tag is $env:GITHUB_REF_NAME but Cargo.toml says $version. Bump the version, commit, and tag that commit."
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$env:VERSION" installer\tabula.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

          # A copy that needs no installing, and a checksum for each download.
          Compress-Archive -Path target\release\tabula.exe, LICENSE-MIT, LICENSE-APACHE -DestinationPath "dist\Tabula-$env:VERSION-windows-x64.zip"
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }
          Get-ChildItem dist

      # A run started by hand: keep the files with the run, publish nothing.
      - name: Attach the files to this run
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: Tabula-${{ env.VERSION }}-windows
          path: dist/
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --title "Tabula $env:VERSION" --generate-notes
