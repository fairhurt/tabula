[package]
name = "tabula"
description = "A PostgreSQL viewer and query tool built with GPUI Kit, with an MCP server so AI agents can use it."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.97"

[dependencies]
gpui-kit = { version = "0.9.0", features = ["test-support", "syntect"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "process"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
futures = "0.3"
interprocess = "2.4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
url = "2"

[build-dependencies]
resvg = { version = "0.45", default-features = false }
ico = "0.4"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
